name: Build home cluster image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: hltv-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: hltv-smoke:local
      - name: Check production server in restricted container
        run: |
          docker run -d --name hltv-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /data:uid=10001,gid=10001 --tmpfs /tmp -p 127.0.0.1:8000:8000 hltv-smoke:local
          trap 'docker logs hltv-smoke; docker rm -f hltv-smoke' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/v1/matches
          docker exec hltv-smoke python -c 'from hltv_api.transport import CurlTransport; c = CurlTransport(); c.close()'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image for Raspberry Pi and amd64
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ptradiverr/hltv-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ptradiverr/hltv-api
      - name: Report deployment image
        env:
          IMAGE: ghcr.io/ptradiverr/hltv-api@${{ steps.publish.outputs.digest }}
        run: echo "Set hltv_api_image in homelab/ansible/group_vars/all.yml to \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
